<!DOCTYPE html>
<html>
<head>
    <title>Student Grade System</title>
</head>
<body>

<script>
function calculateGrade(mark1, mark2, mark3, mark4, mark5) {
    let average = (mark1 + mark2 + mark3 + mark4 + mark5) / 5;

    if (average >= 80) {
        return "A";
    } else if (average >= 60) {
        return "B";
    } else if (average >= 50) {
        return "C";
    } else if (average >= 40) {
        return "D";
    } else {
        return "F";
    }
}

let grade = calculateGrade(85, 78, 90, 88, 80);

console.log("Grade:", grade);
</script>

</body>
</html>
