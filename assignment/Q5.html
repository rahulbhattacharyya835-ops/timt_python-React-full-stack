<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<script>
let numbers = [25, 78, 12, 95, 43];
let largest = numbers[0];

for (let i = 1; i < numbers.length; i++) {
    if (numbers[i] > largest) {
        largest = numbers[i];
    }
}

console.log("Largest Number:", largest);
</script>

</body>
</html>
